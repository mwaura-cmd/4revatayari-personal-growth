<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote to Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Amatic+SC:wght@400;700&family=Caveat:wght@400;700&family=Comfortaa:wght@400;600;700&family=Dancing+Script:wght@400;600;700&family=EB+Garamond:wght@400;600;700&family=Great+Vibes&family=Indie+Flower&family=Kaushan+Script&family=Lexend:wght@400;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;600;700&family=Nothing+You+Could+Do&family=Nunito:wght@400;600;700&family=Oswald:wght@400;600;700&family=Pacifico&family=Patrick+Hand&family=Permanent+Marker&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;600;700&family=Roboto+Serif:wght@400;600;700&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;600&family=Spectral:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>Quote to Image Generator</h1>
      </header>

      <main class="workspace">
        <section class="panel">
          <label class="field">
            <span class="field-label">Your quote</span>
            <textarea
              id="quoteInput"
              rows="8"
              placeholder="Type your quote here"
            >Discipline is the bridge between goals and accomplishment.</textarea>
          </label>

          <div class="controls">
            <label class="field">
              <span class="field-label">Font family</span>
              <select id="fontSelect">
                <optgroup label="Google">
                  <option value='"Amatic SC", cursive'>Amatic SC</option>
                  <option value='"Caveat", cursive'>Caveat</option>
                  <option value='"Comfortaa", sans-serif'>Comfortaa</option>
                  <option value='"EB Garamond", serif' selected>EB Garamond</option>
                  <option value='"Lexend", sans-serif'>Lexend</option>
                  <option value='"Lobster", cursive'>Lobster</option>
                  <option value='"Lora", serif'>Lora</option>
                  <option value='"Merriweather", serif'>Merriweather</option>
                  <option value='"Montserrat", sans-serif'>Montserrat</option>
                  <option value='"Nunito", sans-serif'>Nunito</option>
                  <option value='"Oswald", sans-serif'>Oswald</option>
                  <option value='"Pacifico", cursive'>Pacifico</option>
                  <option value='"Playfair Display", serif'>Playfair Display</option>
                  <option value='"Roboto", sans-serif'>Roboto</option>
                  <option value='"Roboto Mono", monospace'>Roboto Mono</option>
                  <option value='"Roboto Serif", serif'>Roboto Serif</option>
                  <option value='"Spectral", serif'>Spectral</option>
                </optgroup>
                <optgroup label="Handwritten">
                  <option value='"Alex Brush", cursive'>Alex Brush</option>
                  <option value='"Allura", cursive'>Allura</option>
                  <option value='"Dancing Script", cursive'>Dancing Script</option>
                  <option value='"Great Vibes", cursive'>Great Vibes</option>
                  <option value='"Indie Flower", cursive'>Indie Flower</option>
                  <option value='"Kaushan Script", cursive'>Kaushan Script</option>
                  <option value='"Nothing You Could Do", cursive'>Nothing You Could Do</option>
                  <option value='"Patrick Hand", cursive'>Patrick Hand</option>
                  <option value='"Permanent Marker", cursive'>Permanent Marker</option>
                  <option value='"Sacramento", cursive'>Sacramento</option>
                  <option value='"Satisfy", cursive'>Satisfy</option>
                  <option value='"Shadows Into Light", cursive'>Shadows Into Light</option>
                </optgroup>
                <optgroup label="System">
                  <option value="Arial, sans-serif">Arial</option>
                  <option value="Calibri, sans-serif">Calibri</option>
                  <option value='"Comic Sans MS", cursive'>Comic Sans MS</option>
                  <option value='"Courier New", monospace'>Courier New</option>
                  <option value="Georgia, serif">Georgia</option>
                  <option value="Impact, sans-serif">Impact</option>
                  <option value='"Times New Roman", serif'>Times New Roman</option>
                  <option value='"Trebuchet MS", sans-serif'>Trebuchet MS</option>
                  <option value="Verdana, sans-serif">Verdana</option>
                </optgroup>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Quote size</span>
              <div class="range-row">
                <input
                  id="sizeRange"
                  type="range"
                  min="48"
                  max="96"
                  value="72"
                  step="2"
                />
                <span id="sizeValue" class="range-value">72px</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Line height</span>
              <div class="range-row">
                <input
                  id="lineHeightRange"
                  type="range"
                  min="1.05"
                  max="1.6"
                  value="1.1"
                  step="0.05"
                />
                <span id="lineHeightValue" class="range-value">1.1x</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Letter spacing</span>
              <div class="range-row">
                <input
                  id="spacingRange"
                  type="range"
                  min="-3"
                  max="6"
                  value="-0.5"
                  step="0.5"
                />
                <span id="spacingValue" class="range-value">-0.5px</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Text align</span>
              <select id="alignSelect">
                <option value="center">Center</option>
                <option value="left" selected>Left</option>
                <option value="right">Right</option>
              </select>
            </label>
            <label class="field wide">
              <span class="field-label">Text color</span>
              <div class="swatches" role="group" aria-label="Text color">
                <button
                  class="swatch"
                  type="button"
                  data-color="#000000"
                  style="--swatch: #000000"
                  aria-label="Black"
                ></button>
                <button
                  class="swatch is-active"
                  type="button"
                  data-color="#0b3d1a"
                  style="--swatch: #0b3d1a"
                  aria-label="Deep green"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#111111"
                  style="--swatch: #111111"
                  aria-label="Charcoal"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#1f2937"
                  style="--swatch: #1f2937"
                  aria-label="Slate"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#ffffff"
                  style="--swatch: #ffffff"
                  aria-label="White"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#f5e9d0"
                  style="--swatch: #f5e9d0"
                  aria-label="Cream"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#fbbf24"
                  style="--swatch: #fbbf24"
                  aria-label="Gold"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#7c2d12"
                  style="--swatch: #7c2d12"
                  aria-label="Rust"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#0f172a"
                  style="--swatch: #0f172a"
                  aria-label="Navy"
                ></button>
              </div>
            </label>
            <label class="field wide">
              <span class="field-label">Background color</span>
              <div class="swatches" role="group" aria-label="Background color">
                <button
                  class="swatch bg-swatch is-active"
                  type="button"
                  data-color="#ffffff"
                  style="--swatch: #ffffff"
                  aria-label="White"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#008000"
                  style="--swatch: #008000"
                  aria-label="Green"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#006400"
                  style="--swatch: #006400"
                  aria-label="Dark green"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#0b3d1a"
                  style="--swatch: #0b3d1a"
                  aria-label="Forest"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#1f5a4a"
                  style="--swatch: #1f5a4a"
                  aria-label="Evergreen"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#0f172a"
                  style="--swatch: #0f172a"
                  aria-label="Deep navy"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#111111"
                  style="--swatch: #111111"
                  aria-label="Black"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#f5f1e8"
                  style="--swatch: #f5f1e8"
                  aria-label="Ivory"
                ></button>
                <button
                  class="swatch bg-swatch"
                  type="button"
                  data-color="#f6c453"
                  style="--swatch: #f6c453"
                  aria-label="Amber"
                ></button>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Font weight</span>
              <div class="toggle">
                <input id="boldToggle" type="checkbox" />
                <span>Bold quote text</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Font style</span>
              <div class="toggle">
                <input id="italicToggle" type="checkbox" />
                <span>Italic quote text</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Text case</span>
              <div class="toggle">
                <input id="capsToggle" type="checkbox" />
                <span>All caps</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Underline</span>
              <div class="toggle">
                <input id="underlineToggle" type="checkbox" />
                <span>Underline quote</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Footer align</span>
              <select id="footerAlignSelect">
                <option value="center">Center</option>
                <option value="left">Left</option>
                <option value="right" selected>Right</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Footer X</span>
              <div class="range-row">
                <input
                  id="footerXRange"
                  type="range"
                  min="0"
                  max="1080"
                  value="1000"
                  step="10"
                />
                <span id="footerXValue" class="range-value">1000px</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Footer Y</span>
              <div class="range-row">
                <input
                  id="footerYRange"
                  type="range"
                  min="0"
                  max="1350"
                  value="1290"
                  step="10"
                />
                <span id="footerYValue" class="range-value">1290px</span>
              </div>
            </label>
          </div>

          <div class="button-row">
            <button id="generateBtn" class="primary">Generate</button>
            <button id="downloadBtn" class="ghost">Download Image</button>
          </div>

        </section>

        <section class="preview">
          <div class="canvas-frame">
            <canvas id="quoteCanvas" aria-label="Quote preview"></canvas>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
