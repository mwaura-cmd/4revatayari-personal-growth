<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote to Image Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>Quote to Image Generator</h1>
      </header>

      <main class="workspace">
        <section class="panel">
          <label class="field">
            <span class="field-label">Your quote</span>
            <textarea
              id="quoteInput"
              rows="8"
              placeholder="Type your quote here"
            >Discipline is the bridge between goals and accomplishment.</textarea>
          </label>

          <div class="controls">
            <label class="field">
              <span class="field-label">Font family</span>
              <select id="fontSelect">
                <optgroup label="Google">
                  <option value='"Playfair Display", serif' selected>
                    Playfair Display
                  </option>
                  <option value='"Merriweather", serif'>Merriweather</option>
                </optgroup>
                <optgroup label="Sans Serif">
                  <option value="Aptos, sans-serif">Aptos</option>
                  <option value='"Aptos Display", sans-serif'>Aptos Display</option>
                  <option value="Arial, sans-serif">Arial</option>
                  <option value='"Arial Black", sans-serif'>Arial Black</option>
                  <option value='"Arial Narrow", sans-serif'>Arial Narrow</option>
                  <option value='"Arial Rounded MT Bold", sans-serif'>Arial Rounded MT Bold</option>
                  <option value="Bahnschrift, sans-serif">Bahnschrift</option>
                  <option value="Calibri, sans-serif">Calibri</option>
                  <option value='"Calibri Light", sans-serif'>Calibri Light</option>
                  <option value="Candara, sans-serif">Candara</option>
                  <option value='"Century Gothic", sans-serif'>Century Gothic</option>
                  <option value="Corbel, sans-serif">Corbel</option>
                  <option value='"Franklin Gothic Medium", sans-serif'>Franklin Gothic Medium</option>
                  <option value='"Gill Sans MT", sans-serif'>Gill Sans MT</option>
                  <option value="Impact, sans-serif">Impact</option>
                  <option value='"Lucida Sans", sans-serif'>Lucida Sans</option>
                  <option value='"Lucida Sans Unicode", sans-serif'>Lucida Sans Unicode</option>
                  <option value='"Microsoft Sans Serif", sans-serif'>Microsoft Sans Serif</option>
                  <option value='"Segoe UI", sans-serif'>Segoe UI</option>
                  <option value='"Segoe UI Light", sans-serif'>Segoe UI Light</option>
                  <option value='"Segoe UI Semibold", sans-serif'>Segoe UI Semibold</option>
                  <option value='"Segoe UI Black", sans-serif'>Segoe UI Black</option>
                  <option value='"Segoe Print", sans-serif'>Segoe Print</option>
                  <option value='"Segoe Script", sans-serif'>Segoe Script</option>
                  <option value="Tahoma, sans-serif">Tahoma</option>
                  <option value='"Trebuchet MS", sans-serif'>Trebuchet MS</option>
                  <option value="Verdana, sans-serif">Verdana</option>
                </optgroup>
                <optgroup label="Serif">
                  <option value="Cambria, serif">Cambria</option>
                  <option value='"Cambria Math", serif'>Cambria Math</option>
                  <option value="Constantia, serif">Constantia</option>
                  <option value="Garamond, serif">Garamond</option>
                  <option value="Georgia, serif">Georgia</option>
                  <option value='"Palatino Linotype", serif'>Palatino Linotype</option>
                  <option value='"Book Antiqua", serif'>Book Antiqua</option>
                  <option value='"Bookman Old Style", serif'>Bookman Old Style</option>
                  <option value='"Calisto MT", serif'>Calisto MT</option>
                  <option value="Century, serif">Century</option>
                  <option value='"Century Schoolbook", serif'>Century Schoolbook</option>
                  <option value='"Goudy Old Style", serif'>Goudy Old Style</option>
                  <option value="Perpetua, serif">Perpetua</option>
                  <option value='"Times New Roman", serif'>Times New Roman</option>
                  <option value="Rockwell, serif">Rockwell</option>
                  <option value="Sylfaen, serif">Sylfaen</option>
                </optgroup>
                <optgroup label="Monospace">
                  <option value="Consolas, monospace">Consolas</option>
                  <option value='"Courier New", monospace'>Courier New</option>
                  <option value='"Lucida Console", monospace'>Lucida Console</option>
                  <option value='"Lucida Sans Typewriter", monospace'>Lucida Sans Typewriter</option>
                  <option value='"MS Gothic", monospace'>MS Gothic</option>
                  <option value='"MS PGothic", monospace'>MS PGothic</option>
                  <option value='"MS Mincho", monospace'>MS Mincho</option>
                  <option value='"MS PMincho", monospace'>MS PMincho</option>
                </optgroup>
                <optgroup label="Script">
                  <option value='"Bradley Hand ITC", cursive'>Bradley Hand ITC</option>
                  <option value='"Brush Script MT", cursive'>Brush Script MT</option>
                  <option value='"Freestyle Script", cursive'>Freestyle Script</option>
                  <option value='"Lucida Handwriting", cursive'>Lucida Handwriting</option>
                  <option value='"Monotype Corsiva", cursive'>Monotype Corsiva</option>
                  <option value='"Palace Script MT", cursive'>Palace Script MT</option>
                  <option value="Pristina, cursive">Pristina</option>
                </optgroup>
                <optgroup label="Decorative/Symbol">
                  <option value="Algerian, fantasy">Algerian</option>
                  <option value='"Blackadder ITC", fantasy'>Blackadder ITC</option>
                  <option value='"Britannic Bold", fantasy'>Britannic Bold</option>
                  <option value="Castellar, fantasy">Castellar</option>
                  <option value="Chiller, fantasy">Chiller</option>
                  <option value='"Colonna MT", fantasy'>Colonna MT</option>
                  <option value='"Cooper Black", fantasy'>Cooper Black</option>
                  <option value="Elephant, fantasy">Elephant</option>
                  <option value='"Engravers MT", fantasy'>Engravers MT</option>
                  <option value="Forte, fantasy">Forte</option>
                  <option value='"Harlow Solid Italic", fantasy'>Harlow Solid Italic</option>
                  <option value="Harrington, fantasy">Harrington</option>
                  <option value="Jokerman, fantasy">Jokerman</option>
                  <option value="Magneto, fantasy">Magneto</option>
                  <option value='"Matura MT Script Capitals", fantasy'>Matura MT Script Capitals</option>
                  <option value='"Old English Text MT", fantasy'>Old English Text MT</option>
                  <option value="Papyrus, fantasy">Papyrus</option>
                  <option value="Playbill, fantasy">Playbill</option>
                  <option value="Ravie, fantasy">Ravie</option>
                  <option value="Stencil, fantasy">Stencil</option>
                  <option value='"Tempus Sans ITC", fantasy'>Tempus Sans ITC</option>
                  <option value='"Wide Latin", fantasy'>Wide Latin</option>
                  <option value="Symbol, fantasy">Symbol</option>
                  <option value="Webdings, fantasy">Webdings</option>
                  <option value="Wingdings, fantasy">Wingdings</option>
                  <option value="Wingdings 2, fantasy">Wingdings 2</option>
                  <option value="Wingdings 3, fantasy">Wingdings 3</option>
                </optgroup>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Quote size</span>
              <div class="range-row">
                <input
                  id="sizeRange"
                  type="range"
                  min="48"
                  max="96"
                  value="72"
                  step="2"
                />
                <span id="sizeValue" class="range-value">72px</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Line height</span>
              <div class="range-row">
                <input
                  id="lineHeightRange"
                  type="range"
                  min="1.05"
                  max="1.6"
                  value="1.25"
                  step="0.05"
                />
                <span id="lineHeightValue" class="range-value">1.25x</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Letter spacing</span>
              <div class="range-row">
                <input
                  id="spacingRange"
                  type="range"
                  min="0"
                  max="6"
                  value="0"
                  step="0.5"
                />
                <span id="spacingValue" class="range-value">0px</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Text align</span>
              <select id="alignSelect">
                <option value="center" selected>Center</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
              </select>
            </label>
            <label class="field wide">
              <span class="field-label">Text color</span>
              <div class="swatches" role="group" aria-label="Text color">
                <button
                  class="swatch is-active"
                  type="button"
                  data-color="#000000"
                  style="--swatch: #000000"
                  aria-label="Black"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#111111"
                  style="--swatch: #111111"
                  aria-label="Charcoal"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#1f2937"
                  style="--swatch: #1f2937"
                  aria-label="Slate"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#ffffff"
                  style="--swatch: #ffffff"
                  aria-label="White"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#f5e9d0"
                  style="--swatch: #f5e9d0"
                  aria-label="Cream"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#fbbf24"
                  style="--swatch: #fbbf24"
                  aria-label="Gold"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#7c2d12"
                  style="--swatch: #7c2d12"
                  aria-label="Rust"
                ></button>
                <button
                  class="swatch"
                  type="button"
                  data-color="#0f172a"
                  style="--swatch: #0f172a"
                  aria-label="Navy"
                ></button>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Font weight</span>
              <div class="toggle">
                <input id="boldToggle" type="checkbox" />
                <span>Bold quote text</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Font style</span>
              <div class="toggle">
                <input id="italicToggle" type="checkbox" />
                <span>Italic quote text</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Text case</span>
              <div class="toggle">
                <input id="capsToggle" type="checkbox" />
                <span>All caps</span>
              </div>
            </label>
            <label class="field">
              <span class="field-label">Underline</span>
              <div class="toggle">
                <input id="underlineToggle" type="checkbox" />
                <span>Underline quote</span>
              </div>
            </label>
          </div>

          <div class="button-row">
            <button id="generateBtn" class="primary">Generate</button>
            <button id="downloadBtn" class="ghost">Download Image</button>
          </div>

        </section>

        <section class="preview">
          <div class="canvas-frame">
            <canvas id="quoteCanvas" aria-label="Quote preview"></canvas>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
